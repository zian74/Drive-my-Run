<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Drive-my-Run</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div id="app">

    <!-- Écran de configuration -->
    <section id="screen-setup" class="screen active">
      <div class="setup-header">
        <h1>🏃 Drive-my-Run</h1>
        <div class="header-actions">
          <button type="button" id="btn-library" class="btn-reset" title="Ajouter à la bibliothèque" aria-label="Ajouter les réglages actuels à la bibliothèque">📚</button>
          <button type="button" id="btn-save-defaults" class="btn-reset" title="Fixer comme réglages par défaut" aria-label="Fixer les réglages actuels par défaut">💾</button>
          <button type="button" id="btn-reset" class="btn-reset" title="Valeurs par défaut" aria-label="Réinitialiser les valeurs">↺</button>
        </div>
      </div>

      <div class="segmented compact">
        <button type="button" id="mode-pace" class="seg active">Allure</button>
        <button type="button" id="mode-speed" class="seg">Vitesse</button>
      </div>

      <div class="wheel-grid">
        <div class="wheel-wrap" id="wrap-pace">
          <span class="wheel-label">min/km</span>
          <div class="wheel" id="wheel-pace"></div>
        </div>
        <div class="wheel-wrap hidden" id="wrap-speed">
          <span class="wheel-label">km/h</span>
          <div class="wheel" id="wheel-speed"></div>
        </div>
        <div class="wheel-wrap">
          <span class="wheel-label">Durée</span>
          <div class="wheel" id="wheel-duration"></div>
        </div>
        <div class="wheel-wrap">
          <span class="wheel-label">Bip tous les</span>
          <div class="wheel" id="wheel-interval"></div>
        </div>
      </div>

      <div class="wheel-grid">
        <div class="wheel-wrap">
          <span class="wheel-label">Départ dans (s)</span>
          <div class="wheel" id="wheel-countdown"></div>
        </div>
        <div class="wheel-wrap">
          <span class="wheel-label">Répétitions</span>
          <div class="wheel" id="wheel-repeats"></div>
        </div>
        <div class="wheel-wrap">
          <span class="wheel-label">Récupération</span>
          <div class="wheel" id="wheel-recovery"></div>
        </div>
      </div>

      <div class="checkrow center">
        <label><input type="checkbox" id="beep-sound" checked> 🔊 Son</label>
        <label><input type="checkbox" id="beep-vibration" checked> 📳 Vibration</label>
      </div>

      <div id="setup-summary" class="summary compact"></div>

      <div id="library" class="library hidden">
        <span class="wheel-label">📚 Bibliothèque de séances</span>
        <div id="library-row" class="library-row"></div>
      </div>

      <p id="setup-error" class="error hidden" role="alert"></p>

      <button id="btn-start" class="btn btn-primary">Démarrer</button>
    </section>

    <!-- Écran de séance -->
    <section id="screen-run" class="screen">
      <div id="run-phase" class="phase">Prêt</div>
      <div id="run-timer" class="timer">00:00</div>
      <div id="run-sub" class="subtimer"></div>
      <div id="run-stats" class="stats">
        <div class="stat"><span class="stat-label">Intervalle</span><span id="stat-beep" class="stat-value">—</span></div>
        <div class="stat"><span class="stat-label">Bips</span><span id="stat-count" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">Séance</span><span id="stat-session" class="stat-value">1/1</span></div>
        <div class="stat"><span class="stat-label">Distance</span><span id="stat-distance" class="stat-value">0 m</span></div>
      </div>
      <div class="controls">
        <button id="btn-pause" class="btn btn-secondary">Pause</button>
        <button id="btn-stop" class="btn btn-danger">Arrêter</button>
      </div>
    </section>

    <!-- Écran récapitulatif -->
    <section id="screen-summary" class="screen">
      <h1 id="summary-title">Séance terminée 🎉</h1>
      <div id="summary-body" class="summary"></div>
      <div class="controls">
        <button id="btn-again" class="btn btn-primary">Refaire la séance</button>
        <button id="btn-back" class="btn btn-secondary">Nouvelle séance</button>
      </div>
    </section>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="name-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="name-modal-title">
      <span id="name-modal-title">Nommer la séance</span>
      <input type="text" id="name-input" class="name-input" maxlength="30" autocomplete="off"
             placeholder="Ex. Fractionné court" enterkeyhint="done">
      <div class="modal-actions">
        <button type="button" id="name-cancel" class="btn btn-secondary">Annuler</button>
        <button type="button" id="name-save" class="btn btn-primary">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
